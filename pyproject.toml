[project]
name = "iudex"
version = "0.3.1"
description = "Interfaccia locale per interrogare SentenzeWeb, la banca dati pubblica delle sentenze della Corte Suprema di Cassazione"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28.1",
    "certifi",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "respx"]
mcp = ["mcp>=1.2"]
desktop = ["pywebview>=5"]

[project.scripts]
iudex = "iudex.__main__:main"
iudex-finestra = "iudex.desktop:main"
iudex-mcp = "iudex.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iudex*"]

[tool.setuptools.package-data]
iudex = ["certs/*.pem", "static/*", "static/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
