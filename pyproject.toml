[project]
name = "iudex"
dynamic = ["version"]
description = "Interfaccia locale per interrogare SentenzeWeb, la banca dati pubblica delle sentenze della Corte Suprema di Cassazione"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ramingo", email = "28706121+SOsintOps@users.noreply.github.com" }]
keywords = ["cassazione", "sentenze", "giurisprudenza", "sentenzeweb", "osint", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Italian",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi>=0.157.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "certifi",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "respx"]
mcp = ["mcp>=2.3.0"]
desktop = ["pywebview>=6.2.1", "pystray>=0.19.5", "pillow>=11"]

[project.urls]
Homepage = "https://github.com/SOsintOps/Iudex"
Documentation = "https://github.com/SOsintOps/Iudex/blob/main/docs/guida.md"
Issues = "https://github.com/SOsintOps/Iudex/issues"
Changelog = "https://github.com/SOsintOps/Iudex/blob/main/CHANGELOG.md"

[project.scripts]
iudex = "iudex.__main__:main"
iudex-finestra = "iudex.desktop:main"
iudex-mcp = "iudex.mcp_server:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "iudex.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["iudex*"]

[tool.setuptools.package-data]
iudex = ["certs/*.pem", "static/*", "static/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
