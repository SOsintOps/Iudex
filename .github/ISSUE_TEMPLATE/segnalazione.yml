name: Segnalazione
description: Un errore o un risultato diverso dal sito ufficiale
labels: ["bug"]
body:
  - type: textarea
    id: cosa
    attributes:
      label: Che cosa succede
      description: Descrivi il problema. Se i risultati differiscono dal sito ufficiale, indica la ricerca esatta (parole, filtri, ordinamento).
    validations:
      required: true
  - type: input
    id: versione
    attributes:
      label: Versione di Iudex
      description: La trovi nel piè di pagina o nella scheda Stato.
      placeholder: "0.8.1"
  - type: input
    id: ambiente
    attributes:
      label: Sistema
      placeholder: "Windows 11 (installer) oppure Debian 13, Python 3.12 (sorgenti)"
  - type: textarea
    id: registro
    attributes:
      label: Registro delle richieste (scheda Stato) o messaggi d'errore
      render: text
